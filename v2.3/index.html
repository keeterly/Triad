<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#131116" />
  <title>KIZUNA v2.3 | The Shared Deck</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <div id="k-scale">
    <main id="k-stage">

      <!-- backdrop: one painted plate, no baked characters, plus a legibility scrim -->
      <div id="k-backdrop" aria-hidden="true">
        <img id="k-bg" src="../art/bg23-plaza.webp" alt="">
        <div class="k-scrim"></div>
      </div>

      <!-- THE TWO ROWS, as ground a hero can be dropped onto (v2.2's row slots).
           Invisible until a hero is grabbed, then they are the whole question. -->
      <!-- THE FIELD — one perspective volume the whole cast stands in. The rows
           are real translateZ depths inside it, not a faked scale: perspective
           supplies both the shrink and the lift toward the horizon, which is
           what made v2.2 read as a diorama instead of a stack of decals. The
           lanes run left to right — BACK furthest from the Regent, FRONT
           nearest her — because that is the axis the fight is fought along. -->
      <div id="k-field">
        <div id="k-rows" aria-hidden="true">
          <div class="k-row" data-row="back"><span class="k-row-lbl">BACK</span></div>
          <div class="k-row" data-row="mid"><span class="k-row-lbl">MID</span></div>
          <div class="k-row" data-row="front"><span class="k-row-lbl">FRONT</span></div>
        </div>
        <div id="k-boss-art"><span class="k-fig"><img src="../art/foe-mourner.webp" alt="The Mourning Regent"></span><span class="k-shadow"></span></div>
        <div class="k-hero" data-hero="elin">
          <span class="k-fig"><img src="../art/elin.webp" alt="Elin"></span>
          <span class="k-hero-row">BACK</span>
          <span class="k-shadow"></span>
        </div>
        <div class="k-hero" data-hero="mira">
          <span class="k-fig"><img src="../art/mira.webp" alt="Mira"></span>
          <span class="k-hero-row">MID</span>
          <span class="k-shadow"></span>
        </div>
        <div class="k-hero" data-hero="ash">
          <span class="k-fig"><img src="../art/kai.webp" alt="Ash"></span>
          <span class="k-hero-row">FRONT</span>
          <span class="k-shadow"></span>
        </div>
      </div>
      <div id="k-movehint" class="k-hidden"></div>

      <!-- party HUD — upper-left, stacked like a JRPG roster -->
      <div id="k-party-hud">
        <div class="k-pt-hero" data-hero="ash">
          <img src="../art/kai.webp" alt="">
          <div class="k-pt-info">
            <span class="k-pt-name">Ash</span>
            <span class="k-pt-hp"><b>42</b> / 42</span>
            <div class="k-bar"><div class="k-bar-fill k-bar-party"></div></div>
          </div>
        </div>
        <div class="k-pt-hero" data-hero="elin">
          <img src="../art/elin.webp" alt="">
          <div class="k-pt-info">
            <span class="k-pt-name">Elin</span>
            <span class="k-pt-hp"><b>36</b> / 36</span>
            <div class="k-bar"><div class="k-bar-fill k-bar-party"></div></div>
          </div>
        </div>
        <div class="k-pt-hero" data-hero="mira">
          <img src="../art/mira.webp" alt="">
          <div class="k-pt-info">
            <span class="k-pt-name">Mira</span>
            <span class="k-pt-hp"><b>34</b> / 34</span>
            <div class="k-bar"><div class="k-bar-fill k-bar-party"></div></div>
          </div>
        </div>
        <div class="k-pt-shared">
          <span id="k-intercede"></span>
        </div>
      </div>

      <!-- boss HUD — upper-right -->
      <div id="k-boss-hud">
        <div class="k-turn-emblem" title="Turn">
          <svg width="15" height="15" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" transform="rotate(45 8 8)" fill="none" stroke="#c9a45c" stroke-width="1.1"></rect><circle cx="8" cy="8" r="2" fill="#c9a45c"></circle></svg>
          <b id="k-turn-n">1</b>
        </div>
        <div class="k-bname">The Mourning Regent <span id="k-bflag" class="k-bflag"></span></div>
        <div class="k-bhp-row">
          <div class="k-bar k-bar-w"><div id="k-bhp-fill" class="k-bar-fill k-bar-boss"></div></div>
          <span class="k-hpnum"><b id="k-bhp">160</b> / <span id="k-bmax">160</span></span>
        </div>
        <div class="k-b-meta">
          <span class="k-break-wrap">Break <span id="k-break"></span></span>
          <span id="k-chill" class="k-chill"></span>
          <span id="k-bleed"></span>
        </div>
      </div>

      <!-- THE KIZUNA LADDER — what the three of them have built together. Fills
           from blows landed and blows turned; tap it full to spend it. It lives
           in the open sky between the two HUDs: inside the party stack it sat
           on top of whoever was standing in the back row. -->
      <button id="k-kizuna" type="button">
        <span class="k-kz-lbl">KIZUNA</span>
        <span class="k-kz-bar"><span id="k-kz-fill"></span></span>
        <b id="k-kz-n">0%</b>
      </button>

      <!-- the telegraph — icons and amounts, in the sky above the Regent -->
      <div id="k-intent"></div>

      <!-- AP — the orb says how many, the pips say out of how many -->
      <div id="k-ap">
        <div class="k-ap-chip">
          <span id="k-ap-num">3</span><em>AP</em>
        </div>
        <div id="k-ap-pips"></div>
      </div>
      <!-- the log is read aloud, not drawn: the receipts over the heroes and
           the numbers on the board already say everything it used to say -->
      <div id="k-log" class="k-sr" aria-live="polite"></div>

      <!-- the hand -->
      <div id="k-hand"></div>

      <!-- the two piles, as real stacks you can see and open -->
      <button id="k-deck-btn" class="k-pile" title="Draw pile — drop a card here to swap it">
        <span class="k-pile-stack"></span>
        <b id="k-deck-n">10</b>
        <em>DECK</em>
        <span id="k-cycle-dot" title="One free swap this turn"></span>
      </button>
      <button id="k-disc-btn" class="k-pile k-pile-disc" title="Discard">
        <span class="k-pile-stack"></span>
        <b id="k-disc-n">0</b>
        <em>DISCARD</em>
      </button>
      <button id="k-endturn">END TURN</button>

      <!-- overlays -->
      <div id="k-target-ring" class="k-hidden"></div>
      <div id="k-focus" class="k-hidden"></div>
      <div id="k-overlay" class="k-ov k-hidden"></div>

    </main>
  </div>
  <script src="game.js?v=21"></script>
  <script>
    // fit the 932×430 design space to the viewport, v2.2-style
    (function () {
      const fit = () => {
        const s = Math.min(innerWidth / 932, innerHeight / 430);
        document.getElementById('k-scale').style.transform = 'scale(' + s + ')';
      };
      addEventListener('resize', fit); fit();
    })();
  </script>
</body>
</html>
