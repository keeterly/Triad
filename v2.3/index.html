<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#131116" />
  <title>KIZUNA v2.3 | The Shared Deck</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=16" />
</head>
<body>
  <div id="k-scale">
    <main id="k-stage">

      <!-- backdrop: one painted plate, no baked characters, plus a legibility scrim -->
      <div id="k-backdrop" aria-hidden="true">
        <img id="k-bg" src="../art/bg23-plaza.webp" alt="">
        <div class="k-scrim"></div>
      </div>

      <!-- THE TWO ROWS, as ground a hero can be dropped onto (v2.2's row slots).
           Invisible until a hero is grabbed, then they are the whole question. -->
      <div id="k-rows" aria-hidden="true">
        <div class="k-row" data-row="back"><span class="k-row-lbl">BACK</span></div>
        <div class="k-row" data-row="front"><span class="k-row-lbl">FRONT</span></div>
      </div>
      <div id="k-movehint" class="k-hidden"></div>

      <!-- actors: independent transparent plates on one ground line -->
      <div id="k-boss-art"><img src="../art/foe-mourner.webp" alt="The Mourning Regent"><span class="k-shadow"></span></div>
      <div class="k-hero" data-hero="elin">
        <img src="../art/elin.webp" alt="Elin">
        <span class="k-hero-row">BACK</span>
        <span class="k-shadow"></span>
      </div>
      <div class="k-hero" data-hero="ash">
        <img src="../art/kai.webp" alt="Ash">
        <span class="k-hero-row">FRONT</span>
        <span class="k-shadow"></span>
      </div>
      <div class="k-hero" data-hero="mira">
        <img src="../art/mira.webp" alt="Mira">
        <span class="k-hero-row">FRONT</span>
        <span class="k-shadow"></span>
      </div>

      <!-- party HUD — upper-left, stacked like a JRPG roster -->
      <div id="k-party-hud">
        <div class="k-pt-hero" data-hero="ash">
          <img src="../art/kai.webp" alt="">
          <div class="k-pt-info">
            <span class="k-pt-name">Ash</span>
            <span class="k-pt-hp"><b>42</b> / 42</span>
            <div class="k-bar"><div class="k-bar-fill k-bar-party"></div></div>
          </div>
        </div>
        <div class="k-pt-hero" data-hero="elin">
          <img src="../art/elin.webp" alt="">
          <div class="k-pt-info">
            <span class="k-pt-name">Elin</span>
            <span class="k-pt-hp"><b>36</b> / 36</span>
            <div class="k-bar"><div class="k-bar-fill k-bar-party"></div></div>
          </div>
        </div>
        <div class="k-pt-hero" data-hero="mira">
          <img src="../art/mira.webp" alt="">
          <div class="k-pt-info">
            <span class="k-pt-name">Mira</span>
            <span class="k-pt-hp"><b>34</b> / 34</span>
            <div class="k-bar"><div class="k-bar-fill k-bar-party"></div></div>
          </div>
        </div>
        <div class="k-pt-shared">
          <span id="k-intercede"></span>
        </div>
        <div class="k-bond-row">
          <span class="k-bond-lbl">Bond</span>
          <img src="../art/kai.webp" alt="">
          <span id="k-bond-link">∞</span>
          <img src="../art/elin.webp" alt="">
          <span id="k-bond-n" class="k-bond-n">0/2</span>
        </div>
      </div>

      <!-- boss HUD — upper-right -->
      <div id="k-boss-hud">
        <div class="k-turn-emblem" title="Turn">
          <svg width="15" height="15" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" transform="rotate(45 8 8)" fill="none" stroke="#c9a45c" stroke-width="1.1"></rect><circle cx="8" cy="8" r="2" fill="#c9a45c"></circle></svg>
          <b id="k-turn-n">1</b>
        </div>
        <div class="k-bname">The Mourning Regent <span id="k-bflag" class="k-bflag"></span></div>
        <div class="k-bhp-row">
          <div class="k-bar k-bar-w"><div id="k-bhp-fill" class="k-bar-fill k-bar-boss"></div></div>
          <span class="k-hpnum"><b id="k-bhp">120</b> / <span id="k-bmax">120</span></span>
        </div>
        <div class="k-b-meta">
          <span class="k-break-wrap">Break <span id="k-break"></span></span>
          <span id="k-chill" class="k-chill"></span>
          <span id="k-bleed"></span>
        </div>
      </div>

      <!-- the telegraph — icons and amounts, in the sky above the Regent -->
      <div id="k-intent"></div>

      <!-- AP — the resource orb, lower-left -->
      <div id="k-ap">
        <div class="k-ap-chip">
          <span id="k-ap-num">3</span><em>AP</em>
        </div>
      </div>
      <div id="k-log"></div>

      <!-- the hand -->
      <div id="k-hand"></div>

      <!-- the two piles, as real stacks you can see and open -->
      <button id="k-deck-btn" class="k-pile" title="Draw pile">
        <span class="k-pile-stack"></span>
        <b id="k-deck-n">10</b>
        <em>DECK</em>
      </button>
      <button id="k-disc-btn" class="k-pile k-pile-disc" title="Discard">
        <span class="k-pile-stack"></span>
        <b id="k-disc-n">0</b>
        <em>DISCARD</em>
      </button>
      <div id="k-piles"><span class="k-pile-note">CYCLE <b id="k-cycle-n">1</b></span></div>
      <button id="k-endturn">END TURN</button>

      <!-- overlays -->
      <div id="k-target-ring" class="k-hidden"></div>
      <div id="k-focus" class="k-hidden"></div>
      <div id="k-overlay" class="k-ov k-hidden"></div>

    </main>
  </div>
  <script src="game.js?v=16"></script>
  <script>
    // fit the 932×430 design space to the viewport, v2.2-style
    (function () {
      const fit = () => {
        const s = Math.min(innerWidth / 932, innerHeight / 430);
        document.getElementById('k-scale').style.transform = 'scale(' + s + ')';
      };
      addEventListener('resize', fit); fit();
    })();
  </script>
</body>
</html>
