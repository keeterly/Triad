<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KIZUNA</title>
<!--
  THE FRONT DOOR POINTS AT THE CURRENT GAME (Build 224).

  This file used to BE v1 — `game.js?v=360` and `styles.css?v=288`, both still
  sitting beside it — so the plain link to this project opened a game two
  generations old while v2.3 was only reachable by knowing to type the folder.

  It is a redirect rather than a copy of v2.3's index. That index is 35KB of
  markup carrying four `?v=` cache-busters, and a second copy of it at the root
  would mean bumping eight of them every build and keeping two files in step
  forever — a new chore, invented to save one address-bar hop.

  The query string and hash are carried across, so `?cast=2d`, `?seed=…` and any
  deep link keep working through the hop.

  v1's game.js and styles.css stay where they are. Nothing points at them now,
  and they are still playable by their own filenames.
-->
<link rel="canonical" href="v2.3/" />
<meta http-equiv="refresh" content="0; url=v2.3/" />
<script>
  // Runs long before the meta refresh would, and `replace` keeps the redirect
  // out of history so Back does not bounce the player straight back here.
  location.replace('v2.3/' + location.search + location.hash);
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0e0c0b; color: #b9ae97;
    font: 14px/1.5 'Cormorant Garamond', Georgia, serif; }
  main { display: grid; place-items: center; height: 100%; letter-spacing: .18em; }
</style>
</head>
<body>
  <main><a href="v2.3/" style="color:#d6cdba">KIZUNA &rarr;</a></main>
</body>
</html>
