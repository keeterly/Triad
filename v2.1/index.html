<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0a08" />
  <title>KIZUNA v2.1 | Ember Branch</title>
  <!-- PWA: install to the home screen and launch FULLSCREEN (chrome-free).
       Android reads the manifest's display mode; iOS reads the apple- metas. -->
  <link rel="manifest" href="manifest.json?v=2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KIZUNA" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=404" />
</head>
<body>

  <!-- Rotate prompt (landscape only, same rule as v1) -->
  <div id="rotate-prompt">
    <div class="rotate-inner">
      <div class="rotate-icon">⟳</div>
      <div class="rotate-text">Rotate device<br/><span>landscape only</span></div>
    </div>
  </div>

  <div id="stage-scale">
    <main id="stage">

      <!-- Ambient AIR only (fog + rising motes + the color-grade scrim).
           The parallax PLANES themselves moved INTO #diorama (Build 231) so
           the whole world — backdrop, ground, cast, foreground lip — lives in
           ONE 3D space and every camera move parallaxes all of it together. -->
      <div id="fight-bg" aria-hidden="true">
        <div class="hd-fog"></div>
        <div class="hd-motes">
          <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span>
          <span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span>
          <span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span>
          <span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span>
        </div>
      </div>

      <!-- Top strip: chapter chip + turn-order timeline + narrator -->
      <header id="topbar">
        <div id="chapter-chip">CH 1</div>
        <div id="resonance" class="hidden"></div>
        <div id="combat-boons"></div>
        <div id="timeline"></div>
        <button id="menu-btn" aria-label="Menu" title="Menu">☰</button>
        <div id="build-stamp">V2.1 BUILD 233</div>
      </header>
      <div id="narrator"></div>

      <!-- Battlefield: party (left) vs enemies (right).
           TRUE 3D DIORAMA — #battlefield supplies the PERSPECTIVE and #diorama
           is the 3D scene inside it (transform-style: preserve-3d).  The three
           rows sit at real translateZ depths on a raked ground plane, so the
           lanes recede because of geometry rather than a hand-faked scale, and
           the camera can genuinely orbit/dolly through the scene.
           #thread-layer stays a FLAT overlay on purpose: it is drawn from
           measured screen rects, so it tracks the projected figures for free. -->
      <section id="battlefield">
        <div id="diorama">
          <div class="hd-plane hd-far" aria-hidden="true"></div>
          <div class="hd-plane hd-mid" aria-hidden="true"></div>
          <div id="ground" aria-hidden="true"></div>
          <div id="party-half"></div>
          <div id="enemy-half"></div>
          <div class="hd-plane hd-near" aria-hidden="true"></div>
        </div>
        <svg id="thread-layer" aria-hidden="true"></svg>
      </section>

      <!-- Action bar: EP (energy) cluster + END TURN -->
      <section id="action-bar">
        <div id="ep-cluster">
          <div id="ep-dial"><span id="ep-num">3</span><span id="ep-max">/3</span></div>
          <div id="ep-label">EP</div>
          <div id="burst" title="MOMENTUM — parry, exploit weaknesses and chain ASSISTS to fill it, then unleash an ALL-OUT ATTACK">
            <div id="burst-fill"></div>
            <span id="burst-lbl">BURST</span>
          </div>
        </div>
        <div id="hand"></div>
        <button id="btn-endturn">END TURN</button>
      </section>

      <div id="popup-layer"></div>

      <!-- Full-screen overlay: title / story beats / victory / defeat / triad -->
      <div id="overlay" class="hidden">
        <div id="overlay-inner"></div>
      </div>

      <!-- Target-pick veil -->
      <div id="target-hint" class="hidden"></div>

    </main>
  </div>

  <script src="portraits.js?v=3"></script>
  <script src="game.js?v=441"></script>
</body>
</html>
